<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0F172A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Fundo: mapa noturno -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Ruas -->
  <g stroke="#1E293B" stroke-width="3">
    <line x1="0" y1="120" x2="1200" y2="80"/>
    <line x1="0" y1="300" x2="1200" y2="360"/>
    <line x1="0" y1="470" x2="1200" y2="520"/>
    <line x1="180" y1="0" x2="120" y2="630"/>
    <line x1="520" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="980" y2="630"/>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="0" y1="210" x2="1200" y2="200"/>
    <line x1="0" y1="560" x2="1200" y2="600"/>
    <line x1="340" y1="0" x2="360" y2="630"/>
    <line x1="740" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Rota -->
  <path d="M40 600 C 320 580 380 360 520 336 S 830 300 930 150" fill="none"
        stroke="#60A5FA" stroke-opacity="0.25" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 600 C 320 580 380 360 520 336 S 830 300 930 150" fill="none"
        stroke="#60A5FA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Seta no destino -->
  <g transform="translate(930 150) rotate(40) scale(2) translate(-50 -50)">
    <polygon points="50,8 50,66 14,88" fill="#BFD7FF"/>
    <polygon points="50,8 86,88 50,66" fill="#FFFFFF"/>
  </g>

  <!-- Escurecimento para leitura -->
  <rect width="1200" height="630" fill="url(#shade)"/>

  <!-- Logo -->
  <g transform="translate(96 388)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="#2563EB"/>
    <g transform="translate(52 50) scale(0.62) translate(-50 -50)">
      <polygon points="50,8 50,66 14,88" fill="#BFD7FF"/>
      <polygon points="50,8 86,88 50,66" fill="#FFFFFF"/>
    </g>
    <text x="132" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="-2">
      <tspan fill="#FFFFFF">Route</tspan><tspan fill="#93C5FD">Wise</tspan>
    </text>
  </g>

  <!-- Frase -->
  <text x="98" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="30" fill="#CBD5E1">Planeje a rota. Chegue mais rápido.</text>
</svg>
